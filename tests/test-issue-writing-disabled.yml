name: Test ZAP Full Scan - Issue Writing Disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test that the action works with issue writing explicitly disabled.
      # When allow_issue_writing=false, the action should not attempt to create
      # GitHub issues (which would fail on the sentinel repo).
      - id: action
        uses: .
        continue-on-error: true
        with:
          target: 'https://www.example.com'
          allow_issue_writing: 'false'
          fail_action: 'false'
          issue_title: 'ZAP Full Scan Report - Test'
          artifact_name: 'zap_scan_no_issues'

      - name: Assert action ran without attempting issue creation
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should succeed or fail gracefully (not due to GitHub API errors
          # from issue creation, since allow_issue_writing=false).
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed without issue writing"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (constrained environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
