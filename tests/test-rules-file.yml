name: Test ZAP Full Scan with rules file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create ZAP rules file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/hardened/tests/fixtures"
          cat > "$GITHUB_WORKSPACE/hardened/tests/fixtures/zap-rules.tsv" <<'EOF'
          10016	IGNORE	(Web Browser XSS Protection Not Enabled)
          10017	IGNORE	(Cross-Domain JavaScript Source File Inclusion)
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          target: 'https://www.example.com'
          rules_file_name: 'hardened/tests/fixtures/zap-rules.tsv'
          allow_issue_writing: 'false'
          fail_action: 'false'
          artifact_name: 'zap_scan_rules_test'

      - name: Assert action ran with rules_file_name input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with rules_file_name input"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in harness environment without ZAP Docker access or with sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
