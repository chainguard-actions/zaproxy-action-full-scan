name: Test rules_file_name input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a ZAP rules file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/zap-config"
          cat > "$GITHUB_WORKSPACE/zap-config/rules.tsv" <<'EOF'
          10016	IGNORE	(Web Browser XSS Protection Not Enabled)
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          target: 'https://example.com'
          rules_file_name: 'zap-config/rules.tsv'
          fail_action: false
          allow_issue_writing: false
          artifact_name: 'zap_scan_rules_test'

      - name: Assert action ran with rules_file_name input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with rules_file_name input (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
