name: Test with rules_file_name input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          target: 'http://localhost'
          rules_file_name: 'actions/hardened/zaproxy--action-full-scan/v0.10.0/tests/fixtures/rules.tsv'
          fail_action: false
          allow_issue_writing: false
          artifact_name: 'zap_scan_rules'
        continue-on-error: true
      - name: Assert action ran with rules_file_name
        run: |
          echo "Action completed with rules_file_name set"
          echo "PASS"
